<style>
:root{--bg:#000;--fg:#f5f5f5;--mut:#9a9a9a;--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.04);--acc:#e8e8e8;--live:#3dff8a;box-sizing:border-box}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#000}}
*,*::before,*::after{box-sizing:inherit}
html{color-scheme:dark;scrollbar-color:rgba(255,255,255,.3) #050505;scrollbar-gutter:stable;-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
a,button,label,summary,input,select,textarea{touch-action:manipulation}
img,svg{max-width:100%}
body{-webkit-tap-highlight-color:transparent;margin:0;background:var(--bg);color:var(--fg);font-family:"Inter","Segoe UI",Arial,sans-serif;line-height:1.55;overflow-x:hidden}
h1,h2,h3,.disp{font-family:"Oswald","Bebas Neue","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
section{padding:88px 0;position:relative}
.sec-h{font-size:clamp(34px,5vw,56px);margin-bottom:12px}
.sub{color:var(--mut);max-width:620px;margin:0 0 40px}
.btn{display:inline-block;padding:14px 26px;border:1px solid var(--fg);font-family:"Oswald","Arial Narrow",sans-serif;letter-spacing:.12em;text-transform:uppercase;font-size:15px;cursor:pointer;background:transparent;color:var(--fg);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:.25s}
.btn.p{background:var(--fg);color:#000}
.btn:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn.p:hover{background:#fff}
.card{border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));padding:24px;position:relative;transition:.25s}
.card::before{content:"";position:absolute;top:-1px;left:-1px;width:18px;height:18px;border-top:2px solid #fff;border-left:2px solid #fff}
.card::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px}
.card:hover{border-color:rgba(255,255,255,.5);transform:translateY(-3px)}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);padding:6px 12px;background:var(--glass)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
/* nav */
header{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.92);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav{display:flex;align-items:center;gap:22px;height:68px}
.logo{display:flex;align-items:center;gap:10px}
.logo-slot{height:44px;min-width:44px;display:grid;place-items:center;border:1px solid var(--fg);font-family:Oswald,Impact,sans-serif;font-size:20px;padding:0 8px}
.logo img{height:40px;width:auto;display:block}.hero-logo{width:min(420px,70vw);height:auto;display:block;margin-bottom:6px;animation:rise .9s both;filter:drop-shadow(0 0 28px rgba(255,255,255,.25))}
.links{display:flex;gap:18px;margin-left:auto;align-items:center;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase}
.links a{color:var(--mut);transition:.2s;white-space:nowrap}.links a:hover{color:#fff}
.live-tag{white-space:nowrap;font-size:11px;letter-spacing:.14em;display:flex;align-items:center;gap:6px;border:1px solid var(--live);color:var(--live);padding:3px 8px}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);color:#fff;width:44px;height:44px;font-size:20px;cursor:pointer}
/* hero */
.hero{min-height:calc(100vh - 68px);min-height:calc(100svh - 68px);display:flex;align-items:center;overflow:hidden;padding:60px 0;background:radial-gradient(ellipse at 70% 30%,rgba(255,255,255,.12),transparent 55%),#000}
.hero .wrap{width:100%}
.hero .bg{position:absolute;inset:0;pointer-events:none;opacity:.5}
.hero h1{font-size:clamp(56px,11vw,150px);margin:22px 0 14px;line-height:.92;animation:rise .9s both}
.hero h2{font-size:clamp(18px,2.6vw,30px);color:var(--mut);letter-spacing:.2em;margin-bottom:22px;animation:rise .9s .15s both}
.hero p{max-width:560px;color:#c8c8c8;animation:rise .9s .3s both}
.hero .cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px;align-items:center;animation:rise .9s .45s both}
.hero .cta .t{border:0;color:var(--mut);padding:14px 6px;clip-path:none;text-decoration:underline;text-underline-offset:6px}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
/* live */
.stat-row{display:grid;gap:10px;margin:16px 0 20px}
.stat-row div{display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.stat-row span:first-child{color:var(--mut)}
.card h3{font-size:24px;margin-bottom:6px}
.sm{padding:9px 16px;font-size:13px}
/* championship */
.champ{background:linear-gradient(180deg,#000,#0d0d0d 50%,#000);border-block:1px solid var(--line)}
.champ h2{font-size:clamp(44px,7vw,88px);line-height:.98}
.champ .sn{display:block;font-style:normal;font-size:.5em;letter-spacing:.32em;color:var(--mut);margin-top:.28em}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:32px 0 48px}
.facts div{background:#000;padding:22px}
.facts b{display:block;font-family:Oswald,Impact,sans-serif;font-size:34px;font-weight:700}
.facts span{display:block;margin-top:6px;color:var(--mut);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:600px){.champ .facts{grid-template-columns:repeat(2,1fr);margin:24px 0 36px}.facts span{font-size:11px;letter-spacing:.1em}}
.rm{list-style:none;margin:34px auto;padding:0;max-width:440px;counter-reset:st}
.rm li{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:20px;padding:20px 0;border-top:1px solid var(--line)}
.rm li:last-child{border-bottom:1px solid var(--line)}
.rm b{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:500;font-size:clamp(40px,6vw,56px);line-height:1;letter-spacing:.02em;text-align:right}
.rm h4{margin:0;font-family:Oswald,"Arial Narrow",sans-serif;font-weight:500;font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.rm p{margin:2px 0 0;color:var(--mut);font-size:14px}
.rm li.end{background:#fff;color:#000;border-color:#fff;padding:20px 18px 20px 0}
.rm li.end p{color:#444}
@media(max-width:600px){.rm li{grid-template-columns:80px 1fr;gap:16px;padding:16px 0}.rm li.end{padding-right:14px}}
/* feature */
.ico{width:42px;height:42px;border:1px solid var(--line);display:grid;place-items:center;margin-bottom:16px;font-family:Oswald,sans-serif;font-size:18px}
.card p{color:var(--mut);margin:8px 0 0;font-size:15px}
/* table */
.tbl{border:1px solid var(--line);overflow-x:auto;background:var(--glass)}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:15px 20px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:500}
tbody tr{transition:.2s}tbody tr:hover{background:rgba(255,255,255,.06)}
td.r{font-family:Oswald,sans-serif;font-size:22px;width:70px}
tr:first-child td.r{color:#fff}
td.pts{font-weight:700}
.note{color:var(--mut);font-size:13px;margin-top:10px}
/* teams */
.team{text-align:center}
.team small{color:var(--mut);display:block}
/* creators */
.list{list-style:none;padding:0;margin:24px 0 30px;display:grid;gap:10px}
.list li{border:1px solid var(--line);padding:14px 18px;background:var(--glass)}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
/* sponsors */
.spons{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:34px}
.spon{border:1px solid var(--line);height:90px;display:grid;place-items:center;color:var(--mut);filter:grayscale(1);font-family:Oswald,sans-serif;letter-spacing:.2em;transition:.25s}
.spon:hover{color:#fff;border-color:#fff}
/* about */
.about{background:radial-gradient(ellipse at 15% 0%,rgba(255,255,255,.12),transparent 55%),linear-gradient(180deg,#000,#0d0d0d 50%,#000);border-block:1px solid var(--line);overflow:hidden}
.about::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse at 25% 15%,#000,transparent 70%);mask-image:radial-gradient(ellipse at 25% 15%,#000,transparent 70%)}
.about .wrap{position:relative}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.counts div{position:relative;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));padding:22px 20px}
.counts div::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:2px solid #fff;border-left:2px solid #fff}
.counts b{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-size:clamp(36px,5vw,58px);display:block;line-height:1;margin-bottom:8px}
.counts span{color:var(--mut);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.about-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;margin:8px 0 40px;align-items:start}
.about-copy p{color:#c8c8c8;margin:0 0 16px;font-size:17px}
.about-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.about-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.fbrand-col{max-width:380px;flex:1 1 280px}
.fdesc{color:var(--mut);font-size:14px;margin:16px 0 18px}
.fbtns{display:flex;flex-wrap:wrap;gap:10px}
.fnav{width:min(100%,260px)}
.fcol ul.two{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.btn.sm{padding:10px 18px;font-size:13px}
@media(max-width:960px){.about-grid{grid-template-columns:1fr}}
@media(max-width:560px){.about-cards{grid-template-columns:1fr}.final .btn{margin:6px 0!important}}
.brand{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-size:22px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#fff;white-space:nowrap;display:inline-flex;align-items:center}
.tm{min-height:56px}.tmi{display:flex;align-items:center;gap:14px;min-height:26px}
tbody tr:nth-child(-n+3) td{background:rgba(255,255,255,.07);font-weight:600}
tbody tr:nth-child(1) td.r,tbody tr:nth-child(2) td.r,tbody tr:nth-child(3) td.r{color:#fff}
@media(max-width:600px){.brand{font-size:18px}.tmi{gap:10px}th,td{padding:12px 14px}table{min-width:0}}
/* final */
.final{text-align:center;background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.14),transparent 60%);border-top:1px solid var(--line)}
.final h2{font-size:clamp(40px,7vw,92px);margin-bottom:20px}
.final p{max-width:600px;margin:0 auto 32px;color:#c8c8c8}
footer{border-top:1px solid var(--line);padding:56px 0 calc(28px + env(safe-area-inset-bottom,0px));background:#05070a}
.fgrid{display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between;align-items:flex-start}

.fbrand img{width:auto;height:44px}
.fcol{width:min(100%,360px)}
.fcol h4{margin:0 0 14px;font:700 13px/1 "Oswald","Inter",Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#fff}
.fcol ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.fcol a{display:flex;align-items:center;gap:12px;min-height:44px;font-size:14px;color:var(--mut);transition:color .2s}
.fcol a:hover{color:#fff}
.fcol a svg.ic{width:18px;height:18px;flex:none}
.fcol .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--live);white-space:nowrap}
.copy{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);color:var(--mut);font-size:13px}
@media(max-width:960px){.g4,.facts{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.spons{grid-template-columns:repeat(2,1fr)}.counts{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){section{padding:64px 0}.g4,.g3,.g2,.facts{grid-template-columns:1fr}.counts{grid-template-columns:repeat(2,1fr)}}
